<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프로필 카드</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #222222;
    }

    .profile-card {
      width: 100%;
      max-width: 380px;
      background-color: #ffffff;
      border-radius: 24px;
      padding: 40px 28px 36px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(34, 18, 66, 0.22);
    }

    .avatar-placeholder {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background-color: #d9dce3;
      border: 4px solid #f2f4f8;
    }

    .name {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1f2328;
      margin-bottom: 10px;
      cursor: pointer;
      transition: color 0.25s ease, transform 0.25s ease;
    }

    .name:hover {
      color: #764ba2;
      transform: translateY(-1px);
    }

    .bio {
      font-size: 0.98rem;
      line-height: 1.6;
      color: #57606a;
      margin-bottom: 28px;
    }

    .favorites-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #8c959f;
      margin-bottom: 14px;
    }

    .favorites {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .favorites li {
      background-color: #f6f8fa;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 0.96rem;
      font-weight: 500;
      color: #2f363d;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .favorites .emoji {
      font-size: 1.2rem;
      line-height: 1;
    }
  </style>
</head>
<body>
  <main class="profile-card">
    <div class="avatar-placeholder" aria-label="프로필 이미지 영역"></div>
    <h1 class="name">김지수</h1>
    <p class="bio">호기심을 가지고 새로운 아이디어를 작고 단단하게 만들어가는 사람입니다.</p>

    <h2 class="favorites-title">좋아하는 것</h2>
    <ul class="favorites">
      <li><span class="emoji" aria-hidden="true">☕️</span><span>따뜻한 아메리카노</span></li>
      <li><span class="emoji" aria-hidden="true">🎧</span><span>밤에 듣는 잔잔한 음악</span></li>
      <li><span class="emoji" aria-hidden="true">📚</span><span>조용한 서점 산책</span></li>
    </ul>
  </main>
</body>
</html>
